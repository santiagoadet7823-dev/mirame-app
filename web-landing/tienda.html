<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf8f5">
<title>Tienda</title>
<!--
  La vitrina que la clienta abre desde WhatsApp.

  Es HTML plano a propósito, igual que `descargar.html`. El build web de
  Flutter pesa varios MB: alguien que toca un link con datos móviles espera
  ver ropa, no descargar una app de gestión. Acá se ve la primera foto en
  ~1 segundo.

  Lee de Supabase con la clave publicable, contra las vistas `tienda_*`, que
  exponen SOLO columnas de vitrina. El porcentaje del salón y el proveedor no
  se pueden leer ni apuntándole directo a la tabla (ver sql/09_ropa_rls.sql).
-->
<meta property="og:type" content="website">
<meta property="og:title" content="Mirá lo que hay disponible">
<meta property="og:description" content="Elegí lo que te guste y te lo guardamos 48 horas.">
<meta property="og:image" content="__SITE_URL__tienda-preview.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<!--
  Estas `og:` son ESTÁTICAS y no pueden dejar de serlo desde acá: el
  crawler de WhatsApp no ejecuta JavaScript, así que no ve nada de lo que
  arma `cargar()`. Por eso tampoco llevan el nombre del salón — la página
  es multi-salón y quemarlo haría que el segundo comparta el nombre del
  primero. El preview por salón o por producto necesita una Edge Function
  que sirva el HTML con las meta ya escritas (ver 12-BRIEF-TIENDA.md).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#faf8f5; --bg2:#f4f1ec; --surface:#fff;
    --brand:#8b77ec; --brand-bg:#f5f3ff; --border-lav:#ddd6fb;
    --nude:#fdf0ec; --nude-b:#f0c4b8;
    --t:#1a1612; --t2:#5c5248; --t3:#9c9088; --t4:#c4bdb5;
    --border:rgba(0,0,0,.07); --border-md:rgba(0,0,0,.11);
    --danger:#9f1239; --danger-bg:#fff1f2;
    --ok:#166534; --ok-bg:#f0fdf4;
    --r:14px; --r-lg:20px; --r-full:999px;
    --sh:0 1px 2px rgba(0,0,0,.04);
    --ease:cubic-bezier(.4,0,.2,1);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    background:var(--bg); color:var(--t);
    font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
    min-height:100dvh; padding-bottom:88px;
  }
  .wrap{max-width:560px;margin:0 auto;padding:20px 16px}

  header{text-align:center;padding:26px 16px 18px}
  /* Los precios son plata y van en cifras de ancho fijo, como manda el
     design system. Sin esto los números bailan de tarjeta en tarjeta. */
  .precio,.tot{font-variant-numeric:tabular-nums}
  header h1{font-family:"Cormorant Garamond",Georgia,serif;font-size:32px;font-weight:600;line-height:1.05}
  header .sub{font-size:10px;letter-spacing:3px;color:var(--t3);text-transform:uppercase;margin-top:6px}

  /* Solapas de rubro: mas grandes que los filtros de categoria porque son la
     decision principal — "vengo a ver ropa" o "vengo a ver los productos". */
  .rubros{display:flex;gap:6px;padding:0 0 14px}
  .rubro{
    flex:1;padding:11px 8px;border-radius:var(--r);text-align:center;
    border:1px solid var(--border-md);background:var(--surface);
    font-size:12px;font-weight:500;color:var(--t2);cursor:pointer;
    transition:all .18s var(--ease);
  }
  .rubro.on{background:var(--brand-bg);border-color:var(--border-lav);color:var(--brand);font-weight:600}
  .rubro .e{display:block;font-size:17px;margin-bottom:3px}

  /* Escribir a una persona no puede estar solo al final de una reserva: es
     la salida para todo el que mira y tiene una pregunta. */
  .wa-link{
    display:inline-flex;align-items:center;gap:7px;margin-top:12px;
    padding:8px 16px;border-radius:var(--r-full);text-decoration:none;
    border:1px solid var(--border-md);background:var(--surface);
    font-size:12px;font-weight:500;color:var(--t2);
  }
  .wa-link .p{width:7px;height:7px;border-radius:50%;background:#25d366}

  .filtros{display:flex;gap:7px;overflow-x:auto;padding:0 0 14px;scrollbar-width:none}
  .filtros::-webkit-scrollbar{display:none}
  .pill{
    flex:0 0 auto;padding:7px 14px;border-radius:var(--r-full);
    border:1px solid var(--border-md);background:var(--surface);
    font-size:12px;color:var(--t2);cursor:pointer;transition:all .18s var(--ease);
  }
  .pill.on{background:var(--brand-bg);border-color:var(--border-lav);color:var(--brand);font-weight:600}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
    overflow:hidden;box-shadow:var(--sh);cursor:pointer;
    transition:transform .18s var(--ease);
  }
  .card:active{transform:scale(.98)}
  .foto{aspect-ratio:3/4;background:var(--bg2);position:relative;overflow:hidden}
  .foto img{width:100%;height:100%;object-fit:cover;display:block}
  .foto .vacia{display:flex;align-items:center;justify-content:center;height:100%;font-size:34px;opacity:.25}
  .agotado{
    position:absolute;inset:0;background:rgba(255,255,255,.6);
    display:flex;align-items:center;justify-content:center;
  }
  .agotado span{
    background:var(--danger-bg);border:1px solid #fecdd3;color:var(--danger);
    font-size:10px;font-weight:600;padding:4px 11px;border-radius:var(--r-full);
  }
  .destacada{
    position:absolute;left:8px;top:8px;background:var(--nude);border:1px solid var(--nude-b);
    font-size:9px;font-weight:600;padding:3px 8px;border-radius:var(--r-full);
  }
  .info{padding:10px 11px 12px}
  .info .nom{font-size:13px;font-weight:600;line-height:1.3;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .info .precio{font-family:"Cormorant Garamond",Georgia,serif;font-size:18px;font-weight:600;margin-top:5px}
  .info .talles{font-size:10px;color:var(--t3);margin-top:4px}

  /* ── Ficha ── */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:50;align-items:flex-end}
  .modal.on{display:flex}
  .hoja{
    background:var(--surface);width:100%;max-height:92dvh;overflow-y:auto;
    border-radius:var(--r-lg) var(--r-lg) 0 0;animation:sube .26s var(--ease);
  }
  @keyframes sube{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
  .hoja .fotos{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
  .hoja .fotos::-webkit-scrollbar{display:none}
  .hoja .fotos img{width:100%;flex:0 0 100%;aspect-ratio:3/4;object-fit:cover;scroll-snap-align:center}
  .hoja .cuerpo{padding:18px}
  .hoja h2{font-family:"Cormorant Garamond",Georgia,serif;font-size:24px;font-weight:600;line-height:1.15}
  .hoja .cod{font-size:10px;letter-spacing:.5px;color:var(--t4);font-weight:600;margin-bottom:4px}
  .hoja .desc{font-size:13px;color:var(--t2);line-height:1.5;margin-top:8px}
  .hoja .precio{font-family:"Cormorant Garamond",Georgia,serif;font-size:30px;font-weight:600;margin:12px 0 4px}
  .rot{font-size:10px;letter-spacing:1px;color:var(--t3);text-transform:uppercase;margin:16px 0 8px;font-weight:600}
  .opciones{display:flex;flex-wrap:wrap;gap:7px}
  .op{
    padding:9px 14px;border-radius:var(--r-full);border:1px solid var(--border-md);
    background:var(--surface);font-size:12px;cursor:pointer;transition:all .18s var(--ease);
  }
  .op.on{background:var(--brand-bg);border-color:var(--border-lav);color:var(--brand);font-weight:600}
  .op:disabled{opacity:.35;cursor:not-allowed;text-decoration:line-through}

  .btn{
    width:100%;padding:15px;border:none;border-radius:var(--r-full);
    background:var(--brand);color:#fff;font-size:14px;font-weight:600;
    font-family:inherit;cursor:pointer;margin-top:16px;
  }
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.sec{background:var(--surface);color:var(--t);border:1px solid var(--border-md);margin-top:8px}
  .btn.wa{background:#25d366}

  /* ── Carrito ── */
  .barra{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:var(--surface);border-top:1px solid var(--border);
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    display:none;
  }
  .barra.on{display:block}
  .barra .fila{display:flex;align-items:center;justify-content:space-between;max-width:560px;margin:0 auto;gap:12px}
  .barra .n{font-size:12px;color:var(--t2)}
  .barra .tot{font-family:"Cormorant Garamond",Georgia,serif;font-size:20px;font-weight:600}
  .barra button{
    padding:13px 22px;border:none;border-radius:var(--r-full);background:var(--brand);
    color:#fff;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;
  }

  .item{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
  .item img{width:52px;height:66px;object-fit:cover;border-radius:8px;background:var(--bg2)}
  .item .n{font-size:13px;font-weight:600}
  .item .v{font-size:11px;color:var(--t3);margin-top:2px}
  .item .q{margin-left:auto;font-size:13px;font-weight:600}
  .quitar{background:none;border:none;color:var(--t4);font-size:18px;cursor:pointer;padding:0 4px}

  input,textarea{
    width:100%;padding:13px;border:1px solid var(--border-md);border-radius:var(--r);
    background:var(--bg2);font-family:inherit;font-size:14px;color:var(--t);margin-bottom:10px;
  }
  input:focus,textarea:focus{outline:none;border-color:var(--border-lav);background:var(--surface)}
  label{font-size:11px;color:var(--t3);display:block;margin-bottom:5px}

  .vacio{text-align:center;padding:60px 20px;color:var(--t3)}
  .vacio .e{font-size:44px;opacity:.25;margin-bottom:12px}
  .vacio p{font-size:13px}

  .ok{background:var(--ok-bg);border:1px solid #bbf7d0;color:var(--ok);
    padding:14px;border-radius:var(--r);font-size:13px;text-align:center;line-height:1.5}
  .ok b{font-size:22px;letter-spacing:2px;display:block;margin-top:6px}
  .err{background:var(--danger-bg);border:1px solid #fecdd3;color:var(--danger);
    padding:12px;border-radius:var(--r);font-size:12px;margin-bottom:10px}

  /* Tarjetas fantasma del MISMO tamaño que las reales. Sirven para dos
     cosas: que no haya salto de layout cuando llegan los datos, y que el
     cuerpo no diga "buscando" mientras el encabezado ya canta cuántos
     productos hay. */
  .sk{background:var(--surface);border:1px solid var(--border);
    border-radius:var(--r);overflow:hidden}
  .sk .f{aspect-ratio:3/4;background:var(--bg2)}
  .sk .l{height:9px;border-radius:5px;background:var(--bg2);margin:11px 11px 0}
  .sk .l.corta{width:55%;margin-bottom:14px}
  .sk .f,.sk .l{animation:latido 1.4s ease-in-out infinite}
  @keyframes latido{0%,100%{opacity:1}50%{opacity:.55}}

  /* La app respeta `disableAnimations` en todas sus animaciones; la
     vitrina no puede ser la excepción. */
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{
      animation-duration:.01ms !important;
      animation-iteration-count:1 !important;
      transition-duration:.01ms !important;
    }
  }
</style>
</head>
<body>

<header>
  <h1 id="titulo">Cargando…</h1>
  <div class="sub" id="sub"></div>
  <div id="contacto"></div>
</header>

<div class="wrap">
  <div class="rubros" id="rubros"></div>
  <div class="filtros" id="filtros"></div>
  <div id="lista"></div>
</div>

<!-- Ficha de la prenda -->
<div class="modal" id="modal" onclick="if(event.target===this)cerrar()">
  <div class="hoja" id="hoja"></div>
</div>

<!-- Barra del carrito -->
<div class="barra" id="barra">
  <div class="fila">
    <div>
      <div class="n" id="carritoN"></div>
      <div class="tot" id="carritoTot"></div>
    </div>
    <button onclick="verCarrito()">Ver pedido</button>
  </div>
</div>

<script>
const URL_SB = '__SUPABASE_URL__';
const KEY_SB = '__SUPABASE_KEY__';

// El salón sale de `?t=slug`. Sin eso no hay tienda que mostrar: es lo que
// permite que la misma página sirva a todos los salones de la plataforma.
const TIENDA = new URLSearchParams(location.search).get('t') || 'mirame';

let PRODUCTOS = [], VARIANTES = {}, FOTOS = {}, CARRITO = [], FILTRO = 'todo';
let RUBRO = 'todo';

// Los rubros que puede tener un salón. El nombre visible vive acá y no en la
// base para poder cambiarlo sin tocar los productos ya cargados.
const RUBROS = {
  ropa:    {e: '👗', t: 'Ropa'},
  arbell:  {e: '💄', t: 'Arbell'},
  insumos: {e: '🧴', t: 'Insumos'},
};
// El WhatsApp del salón, en dígitos. Sale de `tienda_salon`; si el salón no
// cargó su teléfono, no se ofrece contacto en vez de ofrecer un link roto.
let WA = null;

const $ = id => document.getElementById(id);
const plata = n => '$' + Math.round(n).toLocaleString('es-AR');
const esc = s => (s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function api(recurso, query) {
  const r = await fetch(`${URL_SB}/rest/v1/${recurso}?${query}`, {
    headers: {apikey: KEY_SB, Authorization: 'Bearer ' + KEY_SB},
  });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

/// Tarjetas fantasma mientras llegan los datos.
const esqueleto = (n) => '<div class="grid">' + Array.from({length: n}, () => `
  <div class="sk"><div class="f"></div><div class="l"></div>
    <div class="l corta"></div></div>`).join('') + '</div>';

/// El teléfono como lo quiere wa.me: solo dígitos, en formato
/// internacional. Para Argentina eso es `549` + característica + número.
///
/// Ella lo va a escribir como lo marca: "387 15 540 0000". Ese `15` se
/// usa solo dentro del país y rompe el link; el `9` de celular, al revés,
/// hace falta y casi nadie lo escribe. Devuelve null ante la duda: mejor
/// no ofrecer el botón que ofrecer uno que no lleva a ningún lado.
function telefonoWa(bruto) {
  if (!bruto) return null;
  const crudo = String(bruto).trim();
  let d = crudo.replace(/\D/g, '');
  if (!d) return null;

  // Un internacional explicito de otro pais se respeta tal cual: la
  // plataforma es argentina, pero no tiene por que serlo el salon.
  if (crudo.startsWith('+') && !d.startsWith('54')) {
    return d.length >= 8 ? d : null;
  }

  if (d.startsWith('00')) d = d.slice(2);
  if (d.startsWith('54')) d = d.slice(2);
  if (d.startsWith('0')) d = d.slice(1);          // 0 de larga distancia
  if (d.length > 10 && d.startsWith('9')) d = d.slice(1);

  // El 15 va pegado despues de la caracteristica, que en Argentina tiene
  // 2, 3 o 4 digitos. Sacarlo deja los 10 que espera wa.me.
  if (d.length === 12) {
    for (const i of [2, 3, 4]) {
      if (d.slice(i, i + 2) === '15') { d = d.slice(0, i) + d.slice(i + 2); break; }
    }
  }

  return d.length === 10 ? '549' + d : null;
}

function pintarContacto() {
  if (!WA) return;
  const msg = encodeURIComponent('¡Hola! Te escribo por la tienda');
  $('contacto').innerHTML = `
    <a class="wa-link" href="https://wa.me/${WA}?text=${msg}">
      <span class="p"></span>Escribinos por WhatsApp</a>`;
}

async function cargar() {
  $('lista').innerHTML = esqueleto(4);
  try {
    // Las dos consultas salen JUNTAS. En cascada, el encabezado se
    // actualizaba primero y quedaba diciendo "1 producto" mientras el
    // cuerpo todavía decía que estaba buscando.
    const [prods, salones] = await Promise.all([
      api('tienda_productos',
        `tienda=eq.${encodeURIComponent(TIENDA)}&select=*&order=destacado.desc,created_at.desc`),
      api('tienda_salon',
        `tienda=eq.${encodeURIComponent(TIENDA)}&select=*&limit=1`),
    ]);

    const salon = salones[0];
    const nombre = salon?.nombre || 'Tienda';
    document.title = nombre;
    $('titulo').textContent = nombre;
    WA = telefonoWa(salon?.telefono);
    pintarContacto();

    if (!prods.length) {
      $('sub').textContent = '';
      $('lista').innerHTML =
        '<div class="vacio"><div class="e">🛍️</div><p>Todavía no hay productos publicados</p></div>';
      return;
    }

    PRODUCTOS = prods;
    $('sub').textContent =
      prods.length + (prods.length === 1 ? ' producto' : ' productos');
    // Ahora sí sabemos cuántas tarjetas van: el esqueleto pasa a tener la
    // forma exacta de la grilla que viene, así no hay salto al cambiarlo.
    $('lista').innerHTML = esqueleto(Math.min(prods.length, 6));

    const ids = prods.map(p => p.id);
    // Una sola consulta para variantes y otra para fotos, con `in`: pedir por
    // producto serían 40 requests y en datos móviles eso se nota muchísimo.
    const [vars, fotos] = await Promise.all([
      api('tienda_variantes', `producto_id=in.(${ids.join(',')})&select=*`),
      api('tienda_fotos', `producto_id=in.(${ids.join(',')})&select=*&order=orden.asc`),
    ]);

    for (const v of vars) (VARIANTES[v.producto_id] ??= []).push(v);
    for (const f of fotos) (FOTOS[f.producto_id] ??= []).push(f);

    pintarRubros();
    pintarFiltros();
    pintar();
  } catch (e) {
    $('lista').innerHTML =
      '<div class="vacio"><div class="e">😕</div><p>No se pudo cargar la tienda.<br>Probá de nuevo en un rato.</p></div>';
    console.error(e);
  }
}

const iconoDe = p => (RUBROS[p.rubro || 'ropa'] || RUBROS.ropa).e;

const stockDe = p => (VARIANTES[p.id] || []).reduce((a, v) => a + (v.disponible || 0), 0);

// Solo se muestran las solapas de los rubros que ESTE salón usa. Una tienda
// que solo vende ropa no tiene por qué mostrar dos solapas vacías.
function pintarRubros() {
  const usados = [...new Set(PRODUCTOS.map(p => p.rubro || 'ropa'))]
    .filter(r => RUBROS[r]);
  if (usados.length < 2) { $('rubros').innerHTML = ''; return; }

  $('rubros').innerHTML = [['todo', {e: '✨', t: 'Todo'}],
    ...usados.map(r => [r, RUBROS[r]])]
    .map(([k, v]) => `
      <div class="rubro ${RUBRO === k ? 'on' : ''}" onclick="verRubro('${esc(k)}')">
        <span class="e">${v.e}</span>${esc(v.t)}
      </div>`).join('');
}

function verRubro(k) {
  RUBRO = k;
  // El filtro de categoría se resetea: las categorías de ropa no tienen nada
  // que ver con las de insumos, y arrastrar una dejaría la grilla vacía sin
  // que se entienda por qué.
  FILTRO = 'todo';
  pintarRubros();
  pintarFiltros();
  pintar();
}

/// Los productos del rubro activo.
const delRubro = () =>
  PRODUCTOS.filter(p => RUBRO === 'todo' || (p.rubro || 'ropa') === RUBRO);

function pintarFiltros() {
  const cats = [...new Set(delRubro().map(p => p.categoria).filter(Boolean))];
  if (!cats.length) { $('filtros').innerHTML = ''; return; }
  $('filtros').innerHTML =
    [['todo', 'Todo'], ...cats.map(c => [c, c])]
      .map(([k, t]) =>
        `<div class="pill ${FILTRO === k ? 'on' : ''}" onclick="filtrar('${esc(k)}')">${esc(t)}</div>`)
      .join('');
}

function filtrar(k) { FILTRO = k; pintarFiltros(); pintar(); }

function pintar() {
  const vis = delRubro().filter(p => FILTRO === 'todo' || p.categoria === FILTRO);
  if (!vis.length) {
    $('lista').innerHTML =
      '<div class="vacio"><div class="e">🔍</div><p>No hay nada acá todavía</p></div>';
    return;
  }
  $('lista').innerHTML = '<div class="grid">' + vis.map(p => {
    const foto = (FOTOS[p.id] || [])[0];
    const sin = stockDe(p) <= 0;
    const talles = [...new Set((VARIANTES[p.id] || [])
      .filter(v => v.disponible > 0).map(v => v.talle).filter(Boolean))];
    return `
      <div class="card" onclick="abrir('${p.id}')">
        <div class="foto">
          ${foto ? `<img src="${esc(foto.path)}" alt="${esc(p.nombre)}" loading="lazy">`
                 : `<div class="vacia">${iconoDe(p)}</div>`}
          ${p.destacado && !sin ? '<div class="destacada">✨ Nuevo</div>' : ''}
          ${sin ? '<div class="agotado"><span>Agotado</span></div>' : ''}
        </div>
        <div class="info">
          <div class="nom">${esc(p.nombre)}</div>
          <div class="precio">${plata(p.precio)}</div>
          ${talles.length ? `<div class="talles">${
              (p.rubro || 'ropa') === 'ropa' ? 'Talles ' : ''
            }${talles.map(esc).join(' · ')}</div>` : ''}
        </div>
      </div>`;
  }).join('') + '</div>';
}

// ── Ficha ──────────────────────────────────────────────────────────────────
let ACTUAL = null, VARIANTE = null;

function abrir(id) {
  ACTUAL = PRODUCTOS.find(p => p.id === id);
  VARIANTE = null;
  const fotos = FOTOS[id] || [], vars = VARIANTES[id] || [];

  $('hoja').innerHTML = `
    <div class="fotos">
      ${fotos.length ? fotos.map(f =>
          `<img src="${esc(f.path)}" alt="${esc(ACTUAL.nombre)}">`).join('')
        : `<div class="foto"><div class="vacia">${iconoDe(ACTUAL)}</div></div>`}
    </div>
    <div class="cuerpo">
      ${ACTUAL.codigo ? `<div class="cod">${esc(ACTUAL.codigo)}</div>` : ''}
      <h2>${esc(ACTUAL.nombre)}</h2>
      <div class="precio">${plata(ACTUAL.precio)}</div>
      ${ACTUAL.descripcion ? `<div class="desc">${esc(ACTUAL.descripcion)}</div>` : ''}
      ${vars.length ? `<div class="rot">Elegí</div><div class="opciones" id="ops">
        ${vars.map((v, i) => `
          <button class="op" ${v.disponible > 0 ? '' : 'disabled'} onclick="elegir(${i})">
            ${esc([v.talle, v.color].filter(Boolean).join(' · ') || 'Único')}
          </button>`).join('')}
      </div>` : ''}
      <button class="btn" id="btnAdd" disabled onclick="alCarrito()">Elegí una opción</button>
      <button class="btn sec" onclick="cerrar()">Seguir mirando</button>
    </div>`;
  $('modal').classList.add('on');
  document.body.style.overflow = 'hidden';

  // Con una sola opción se elige sola: hacer tocar un botón que no ofrece
  // alternativa es un paso vacío.
  const libres = vars.map((v, i) => [v, i]).filter(([v]) => v.disponible > 0);
  if (libres.length === 1) elegir(libres[0][1]);
}

function elegir(i) {
  VARIANTE = (VARIANTES[ACTUAL.id] || [])[i];
  document.querySelectorAll('#ops .op').forEach((b, k) => b.classList.toggle('on', k === i));
  const b = $('btnAdd');
  b.disabled = false;
  b.textContent = 'Agregar al pedido';
}

function cerrar() {
  $('modal').classList.remove('on');
  document.body.style.overflow = '';
}

function alCarrito() {
  if (!VARIANTE) return;
  const ya = CARRITO.find(l => l.variante_id === VARIANTE.id);
  // Nunca por encima de lo disponible: la reserva rebotaría del lado del
  // servidor y la clienta se enteraría recién al confirmar.
  if (ya) {
    if (ya.cantidad >= VARIANTE.disponible) return cerrar();
    ya.cantidad++;
  } else {
    CARRITO.push({
      variante_id: VARIANTE.id, cantidad: 1,
      nombre: ACTUAL.nombre, precio: ACTUAL.precio,
      variante: [VARIANTE.talle, VARIANTE.color].filter(Boolean).join(' · '),
      foto: (FOTOS[ACTUAL.id] || [])[0]?.path,
      tope: VARIANTE.disponible,
    });
  }
  cerrar();
  pintarBarra();
}

function pintarBarra() {
  const n = CARRITO.reduce((a, l) => a + l.cantidad, 0);
  $('barra').classList.toggle('on', n > 0);
  $('carritoN').textContent = n + (n === 1 ? ' producto' : ' productos');
  $('carritoTot').textContent =
    plata(CARRITO.reduce((a, l) => a + l.precio * l.cantidad, 0));
}

// ── Pedido ─────────────────────────────────────────────────────────────────
function verCarrito() {
  const total = CARRITO.reduce((a, l) => a + l.precio * l.cantidad, 0);
  $('hoja').innerHTML = `
    <div class="cuerpo">
      <h2>Tu pedido</h2>
      <div style="margin-top:14px">
        ${CARRITO.map((l, i) => `
          <div class="item">
            ${l.foto ? `<img src="${esc(l.foto)}" alt="">` : '<img alt="">'}
            <div>
              <div class="n">${esc(l.nombre)}</div>
              <div class="v">${esc(l.variante)} · ${plata(l.precio)}</div>
            </div>
            <div class="q">×${l.cantidad}</div>
            <button class="quitar" onclick="quitar(${i})">✕</button>
          </div>`).join('')}
      </div>
      <div style="display:flex;justify-content:space-between;margin:16px 0 4px">
        <span style="font-size:13px;color:var(--t2)">Total</span>
        <span class="tot" style="font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600">${plata(total)}</span>
      </div>

      <div class="rot">Tus datos</div>
      <div id="errBox"></div>
      <label>Nombre</label>
      <input id="fNombre" placeholder="Tu nombre" autocomplete="name">
      <label>WhatsApp</label>
      <input id="fTel" placeholder="Para avisarte" inputmode="tel" autocomplete="tel">

      <button class="btn" id="btnRes" onclick="reservar()">Reservar por 48 horas</button>
      <p style="font-size:11px;color:var(--t3);text-align:center;margin-top:10px;line-height:1.5">
        Te lo guardamos 48 horas.<br>Después te escribimos para coordinar.
      </p>
      <button class="btn sec" onclick="cerrar()">Seguir mirando</button>
    </div>`;
  $('modal').classList.add('on');
  document.body.style.overflow = 'hidden';
}

function quitar(i) { CARRITO.splice(i, 1); pintarBarra(); CARRITO.length ? verCarrito() : cerrar(); }

async function reservar() {
  const nombre = $('fNombre').value.trim();
  const tel = $('fTel').value.trim();
  if (!nombre) {
    $('errBox').innerHTML =
      '<div class="err">Poné tu nombre así sabemos para quién guardarlo</div>';
    return;
  }

  const b = $('btnRes');
  b.disabled = true;
  b.textContent = 'Reservando…';

  try {
    const r = await fetch(`${URL_SB}/rest/v1/rpc/crear_reserva`, {
      method: 'POST',
      headers: {apikey: KEY_SB, Authorization: 'Bearer ' + KEY_SB,
                'Content-Type': 'application/json'},
      body: JSON.stringify({
        p_tienda: TIENDA, p_nombre: nombre, p_telefono: tel,
        p_items: CARRITO.map(l => ({variante_id: l.variante_id, cantidad: l.cantidad})),
      }),
    });
    if (!r.ok) throw new Error(await r.text());
    const codigo = (await r.json()).replace(/"/g, '');

    const detalle = CARRITO
      .map(l => `• ${l.nombre}${l.variante ? ' (' + l.variante + ')' : ''} ×${l.cantidad}`)
      .join('\n');
    const msg = encodeURIComponent(
      `¡Hola! Reservé con el código ${codigo}\n\n${detalle}\n\nSoy ${nombre}`);

    $('hoja').innerHTML = `
      <div class="cuerpo" style="text-align:center">
        <div style="font-size:46px;margin:10px 0">🎉</div>
        <h2>¡Listo, ${esc(nombre)}!</h2>
        <div class="ok" style="margin-top:16px">
          Te lo guardamos por 48 horas.<br>Tu código es
          <b>${esc(codigo)}</b>
        </div>
        ${WA ? `<a href="https://wa.me/${WA}?text=${msg}" class="btn wa"
                  style="display:block;text-decoration:none;line-height:1.2">
                  Avisar por WhatsApp</a>` : ''}
        <button class="btn sec" onclick="reiniciar()">Seguir mirando</button>
      </div>`;
    CARRITO = [];
    pintarBarra();
  } catch (e) {
    // El mensaje del servidor es el que importa: "se quedó sin stock una de
    // las prendas" le dice qué hacer; un "error 400" no.
    let m = 'No se pudo reservar. Probá de nuevo.';
    try { m = JSON.parse(e.message).message || m; } catch (_) {}
    $('errBox').innerHTML = `<div class="err">${esc(m)}</div>`;
    b.disabled = false;
    b.textContent = 'Reservar por 48 horas';
  }
}

function reiniciar() { cerrar(); cargar(); }

cargar();
</script>
</body>
</html>
