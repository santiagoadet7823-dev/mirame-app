name: mirame
description: Mírame Lash Studio — gestión de salón (APK Android + PWA).
publish_to: none

# versionName + versionCode salen de acá. El versionCode (después del +)
# SIEMPRE sube en 1 y NUNCA baja: Android rechaza instalar uno menor y eso
# deja a la flota trabada sin arreglo remoto. Usar scripts/bump-version.sh.
version: 1.14.0+25

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # — Estado y navegación —
  flutter_riverpod: ^3.4.2
  go_router: ^17.5.0            # la PWA necesita URLs reales

  # — Datos locales (fuente de verdad de la UI) —
  drift: ^2.34.3
  # quedó VACÍO: con sqlite3 3.x la librería nativa ya viene incluida y el
  # paquete viejo no hace nada. `drift_flutter` resuelve además la ruta del
  # archivo y el worker de web sin código extra.
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  path: ^1.9.1

  # — Backend —
  supabase_flutter: ^2.17.2

  # — Push (Firebase se usa SOLO para esto) —
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter_local_notifications: ^22.3.0
  # Lo exige zonedSchedule. La zona se fija a America/Argentina/Salta en vez
  # de leerla del sistema: el negocio esta ahi y el cierre de caja de las
  # 21:00 no tiene que moverse si la duena viaja.
  timezone: ^0.11.1

  # — Utilidades —
  dio: ^5.11.0                  # descarga del APK con progreso
  package_info_plus: ^10.2.1    # versión instalada, para el auto-updater
  connectivity_plus: ^7.3.1     # dispara el drenaje del outbox
  url_launcher: ^6.3.2          # WhatsApp hacia las clientas
  share_plus: ^13.3.0           # export CSV
  # Elegir el .json al restaurar un backup. Se prefiere sobre file_picker: es
  # del equipo de Flutter, no arrastra permisos de almacenamiento y en Android
  # usa el selector del sistema (SAF), asi que no hace falta pedir acceso a
  # los archivos del telefono.
  file_selector: ^1.0.3
  # Liquidacion en PDF para mandarle al proveedor. Es Dart puro (no arrastra
  # nada nativo) y genera el archivo en memoria; despues se comparte con
  # share_plus, que ya esta. Se elige  solo y NO : printing trae
  # un plugin nativo por plataforma que solo hace falta para mandar a una
  # impresora, y acá el PDF va por WhatsApp.
  pdf: ^3.11.3
  # Fotos de las prendas. `image_picker` para sacarlas o elegirlas, y
  # `flutter_image_compress` para bajarlas de 3-4 MB a ~150 KB ANTES de subir:
  # sin eso el free tier de 1 GB se agota en ~300 fotos y la tienda tarda una
  # eternidad con datos moviles. La alternativa en Dart puro tarda segundos por
  # foto en un telefono de gama media.
  # Escanear el codigo de barras del producto. Es el sucesor mantenido de
  # qr_code_scanner (archivado) y usa MLKit en Android: lee EAN-13, UPC y QR
  # sin configuracion.
  mobile_scanner: ^7.1.4
  image_picker: ^1.2.0
  flutter_image_compress: ^2.4.0
  flutter_svg: ^2.3.0           # los 12 iconos del original
  # QR de invitacion. Pinta con CustomPainter, sin assets ni red: pesa ~40 KB
  # y respeta la regla de no meter librerias pesadas.
  qr_flutter: ^4.1.0
  intl: ^0.20.3
  uuid: ^4.6.0                  # v7 generado en el cliente
  shared_preferences: ^2.5.5
  # No se usa directamente. Va porque algun paquete referencia CupertinoIcons
  # y sin el la build imprime "Expected to find fonts for CupertinoIcons" en
  # cada compilacion. Tree-shaking lo deja en bytes.
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  # No se agrega el paquete `test`: choca con el matcher que flutter_test
  # pinea. Los tests de `domain/` importan flutter_test, que lo re-exporta.
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.5
  build_runner: ^2.16.0

flutter:
  uses-material-design: true

  # 14 iconos portados del index.html + los 46 del diseñador.
  assets:
    - assets/icons/
    - assets/brand/

  # Fuentes LOCALES, no google_fonts por CDN: la app tiene que abrir sin red.
  #
  # Son fuentes VARIABLES (un archivo por familia, con eje de peso). Google
  # Fonts ya no publica instancias estáticas de Inter ni de Cormorant.
  #
  # ⚠️ Consecuencia: `fontWeight` solo NO mueve el eje de forma confiable. Los
  # estilos de texto deben setear TAMBIÉN `fontVariations`:
  #
  #     TextStyle(
  #       fontFamily: MType.sans,
  #       fontWeight: FontWeight.w600,                      // fallback
  #       fontVariations: [FontVariation('wght', 600)],     // el que manda
  #     )
  #
  # Está centralizado en `core/theme/app_theme.dart`; no repetirlo por widget.
  #
  # No se incluyen las itálicas: el index.html original las declara en la URL
  # de Google Fonts pero NINGÚN elemento las usa. Ahorra ~1,6 MB.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: CormorantGaramond
      fonts:
        - asset: assets/fonts/CormorantGaramond-Variable.ttf
    # Solo para el wordmark "Mírame" del splash y el login (decisión del
    # diseñador; el original usaba Cormorant ahí). Estática, 61 KB.
    - family: Parisienne
      fonts:
        - asset: assets/fonts/Parisienne-Regular.ttf
