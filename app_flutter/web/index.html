<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Gestión de turnos, clientas, caja y stock para tu estudio.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Mírame">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Mírame Lash Studio</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#faf8f5">

  <!-- Pantalla de carga propia. Hasta que Flutter pinta el primer frame el
       navegador muestra esto; si nunca lo pinta (un CDN bloqueado, un
       navegador sin WebAssembly, un error al arrancar), a los 30 s dice que
       paso y ofrece recargar. Sin esto la PWA quedaba en blanco y muda, y
       una app que no dice nada no se distingue de una rota. Los colores son
       los tokens del design system; sin fuentes externas a proposito. -->
  <style>
    #cargando {
      position: fixed; inset: 0; z-index: 1;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 10px; padding: 32px; text-align: center;
      background: #faf8f5; color: #5c5248;
      font: 14px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      transition: opacity .25s ease;
    }
    #cargando.oculto { opacity: 0; pointer-events: none; }
    #cargando .nombre { font: 500 28px/1.2 Georgia, "Times New Roman", serif;
      color: #1a1612; letter-spacing: .5px; margin-bottom: 4px; }
    #cargando .detalle { font-size: 12px; color: #9c9088; max-width: 320px;
      word-break: break-word; }
    #cargando button { margin-top: 14px; padding: 10px 24px; border-radius: 999px;
      border: 1px solid rgba(0,0,0,.11); background: #fff; color: #5c5248;
      font: 500 13px inherit; cursor: pointer; }
  </style>
</head>
<body>
  <div id="cargando">
    <div class="nombre">Mírame</div>
    <div id="cargando-estado">Cargando…</div>
    <div id="cargando-detalle" class="detalle"></div>
  </div>
  <script>
    (function () {
      var cargando = document.getElementById('cargando');
      var estado = document.getElementById('cargando-estado');
      var detalle = document.getElementById('cargando-detalle');
      var ultimoError = '';
      var listo = false;

      function ocultar() {
        listo = true;
        cargando.classList.add('oculto');
      }
      // Flutter lo dispara cuando ya hay algo en pantalla.
      window.addEventListener('flutter-first-frame', ocultar);

      function anotar(e) {
        // Un <script> o un import que no carga llega como evento sobre el
        // elemento, sin mensaje: se anota la URL que fallo, que es lo util.
        var t = e && e.target;
        var src = t && (t.src || t.href);
        var m = e && (e.reason || e.error || e.message);
        var texto = m && m.message ? m.message : (m || (src ? 'no cargo ' + src : ''));
        if (texto) ultimoError = String(texto).slice(0, 200);
      }
      window.addEventListener('error', anotar, true);
      window.addEventListener('unhandledrejection', anotar);

      setTimeout(function () {
        if (listo) return;
        // Sin un error anotado puede ser solo una conexión lenta (la app
        // pesa ~5 MB): se avisa, pero no se da por rota.
        estado.textContent = ultimoError
          ? 'No se pudo cargar la app.'
          : 'Está tardando más de lo normal.';
        detalle.textContent = ultimoError
          ? 'Revisá si un bloqueador de anuncios o la prevención de rastreo ' +
            'del navegador la está frenando. Detalle: ' + ultimoError
          : 'Podés esperar un poco más o recargar.';
        var b = document.createElement('button');
        b.textContent = 'Recargar';
        b.onclick = function () { location.reload(); };
        cargando.appendChild(b);
      }, 30000);
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
